<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | Job Portal</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard {
      max-width: 800px;
      margin: 60px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .dashboard h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-box {
      background: #f0f4ff;
      padding: 20px;
      border-radius: 10px;
      flex: 1 1 30%;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.05);
    }

    .stat-box h3 {
      margin-bottom: 10px;
      font-size: 18px;
      color: #555;
    }

    .stat-box p {
      font-size: 24px;
      color: #1e90ff;
      font-weight: bold;
    }

    .job-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .job-card h4 {
      margin: 0;
      color: #333;
    }

    .job-card small {
      color: #777;
    }

    .job-card span {
      display: inline-block;
      background: #eef1f8;
      color: #333;
      padding: 4px 10px;
      margin-top: 5px;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>

<div class="dashboard">
  <h2>Admin Dashboard</h2>

  <div class="stats">
    <div class="stat-box">
      <h3>Total Jobs Posted</h3>
      <p>2</p>
    </div>
    <div class="stat-box">
      <h3>Total Applications</h3>
      <p>10</p>
    </div>
    <div class="stat-box">
      <h3>Total Employers</h3>
      <p>2</p>
    </div>
  </div>

  <h3 style="margin-bottom: 15px;">Jobs Posted</h3>

  <div class="job-card">
    <h4>Frontend Developer</h4>
    <small>ABC Corp • Remote</small><br>
    <span>Full Time</span>
  </div>

  <div class="job-card">
    <h4>Backend Developer</h4>
    <small>XYZ Inc • Bangalore</small><br>
    <span>Contract</span>
  </div>
</div>

</body>
</html>
