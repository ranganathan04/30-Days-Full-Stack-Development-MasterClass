<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Portal Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-container {
      max-width: 400px;
      margin: 80px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .toggle {
      text-align: center;
      margin-bottom: 20px;
      color: #1e90ff;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .form-group button {
      width: 100%;
      padding: 10px;
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h2 id="form-title">Login</h2>

  <div id="login-form">
    <div class="form-group">
      <input type="email" placeholder="Email" required />
    </div>
    <div class="form-group">
      <input type="password" placeholder="Password" required />
    </div>
    <div class="form-group">
      <button onclick="alert('Login Successful (Simulated)')">Login</button>
    </div>
  </div>

  <div id="register-form" class="hidden">
    <div class="form-group">
      <input type="text" placeholder="Full Name" required />
    </div>
    <div class="form-group">
      <input type="email" placeholder="Email" required />
    </div>
    <div class="form-group">
      <input type="password" placeholder="Password" required />
    </div>
    <div class="form-group">
      <button onclick="alert('Registered Successfully (Simulated)')">Register</button>
    </div>
  </div>

  <div class="toggle" onclick="toggleForm()">Don't have an account? Register here</div>
</div>

<script>
  function toggleForm() {
    const login = document.getElementById('login-form');
    const register = document.getElementById('register-form');
    const title = document.getElementById('form-title');
    const toggle = document.querySelector('.toggle');

    if (login.classList.contains('hidden')) {
      login.classList.remove('hidden');
      register.classList.add('hidden');
      title.innerText = 'Login';
      toggle.innerText = "Don't have an account? Register here";
    } else {
      login.classList.add('hidden');
      register.classList.remove('hidden');
      title.innerText = 'Register';
      toggle.innerText = "Already have an account? Login here";
    }
  }
</script>

</body>
</html>
